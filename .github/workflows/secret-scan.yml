name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan current files
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/scan-current"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/scan-current"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/scan-current" \
            --redact=100 --no-banner --max-archive-depth=3 --max-decode-depth=3

      - name: Scan new commits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            # A new ref has no previous tip; the full current tree was scanned above.
            range="--max-count=1 $PUSH_AFTER"
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            echo 'Cannot resolve the previous tip; run a historical audit before merging.' >&2
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--no-textconv $range" --gitleaks-ignore-path=.gitleaksignore \
            --redact=100 --no-banner --max-archive-depth=3 --max-decode-depth=3
